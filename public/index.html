<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Lista zadań</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <style>
      :root {
        --bg-color: #151515;
      }
      html,
      body {
        background-color: var(--bg-color);
      }
    </style>
    <script>
      (function () {
        try {
          var settings = JSON.parse(localStorage.getItem("settings"));
          if (settings && settings.isDarkTheme === false) {
            var bgColor = "#eee";
            var themeColor = "#007380";
            document.documentElement.style.setProperty("--bg-color", bgColor);
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", themeColor);
          }
        } catch (e) {}
      })();
    </script>

    <meta property="og:image" content="%PUBLIC_URL%/share.png" />
    <meta property="og:title" content="Lista zadań" />
    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="Nowoczesna i intuicyjna aplikacja do zarządzania codziennymi zadaniami."
    />

    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700;1,800&family=Roboto+Mono:wght@400;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700;1,800&family=Roboto+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var setAppHeight = function () {
          var doc = document.documentElement;
          doc.style.setProperty("--app-height", window.innerHeight + "px");
        };
        window.addEventListener("resize", setAppHeight);
        setAppHeight();
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
