<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Lista zadań</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />

    <meta name="theme-color" content="#ffffff" />

    <!-- This script sets the status bar and root background color BEFORE React loads.
         It prevents thermal flashing by synchronizing with theme settings in localStorage.
         Colors must stay in sync with src/common/ThemeSwitch/themeSaga.ts:
         - Light mode / default: #007380 bar, #ffffff background
         - Dark mode: #005c67 bar, #151515 background -->
    <script>
      (function () {
        try {
          var settings = JSON.parse(localStorage.getItem("settings"));
          var isDark = settings && settings.isDarkTheme === true;

          // 1. Set the mobile status bar theme color
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", isDark ? "#005c67" : "#007380");
          }

          // 2. Set doc element styles early to eliminate white-flash during initialization
          var bgColor = isDark ? "#151515" : "#ffffff";
          var textColor = isDark ? "#eeeeee" : "#222222";
          
          document.documentElement.style.backgroundColor = bgColor;
          document.documentElement.style.color = textColor;
        } catch (e) {
          console.error("Theme initialization error:", e);
        }
      })();
    </script>

    <meta property="og:image" content="%PUBLIC_URL%/screenshots/desktop.png" />
    <meta property="og:title" content="Lista zadań" />
    <meta
      property="og:description"
      content="Nowoczesna i intuicyjna aplikacja do zarządzania codziennymi zadaniami."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://to-do-list.myprojects.pl/" />
    <meta
      name="description"
      content="Nowoczesna i intuicyjna aplikacja do zarządzania codziennymi zadaniami."
    />

    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lista zadań" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700;1,800&family=Roboto+Mono:wght@400;700&display=swap"
      as="style"

    <link

  </head>
