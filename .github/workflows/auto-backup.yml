name: Automated Backup to Google Drive

on:
  schedule:
    - cron: "0 2 * * *" # Every day at 02:00 AM
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Backup
        run: |
          curl -L -X POST "https://to-do-list.myprojects.pl/backup-autoAllUsersToGoogleDrive" \
          -H "Content-Type: application/json" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
          -d '{}'
